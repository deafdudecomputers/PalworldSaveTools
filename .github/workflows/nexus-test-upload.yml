name: Nexus Test Upload (Windows)

# Builds the Inno Setup installer, zips it (installer at archive root),
# and uploads it to a Nexus file slot. Use this to verify a
# candidate artifact passes Nexus's scan before wiring it into the real
# release pipeline.
#
# Pre-requisite: create a throwaway file entry on the mod page first
# (Files tab -> add a placeholder), then grab its file_id from the URL
# (files?tab=files&file_id=XXXXX) and pass it below.
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Nexus file_id of the test file slot on the mod page"
        required: true
        default: "7743117"
      display_name:
        description: "Nexus file display name"
        required: false
        default: "TEST-inno-win"

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Bootstrap environment
        id: env
        uses: ./.github/actions/setup-build-env
      - name: Install dependencies
        run: |
          uv venv --clear
          uv pip install -r requirements.txt
      - name: Build Inno Setup installer
        run: uv run python build/build_inno.py
      - name: Zip installer (bare at archive root)
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/installer -Filter "PalworldSaveTools-v*-windows-setup.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "No installer found in build/installer/"; exit 1 }
          Compress-Archive -Path $exe.FullName -DestinationPath "pst-win-inno-test.zip"
          Get-Item "pst-win-inno-test.zip" | Select-Object Name, Length
      - name: Upload to Nexus
        uses: Nexus-Mods/upload-action@v1.0.0-beta.8
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ github.event.inputs.file_id }}
          filename: pst-win-inno-test.zip
          version: ${{ steps.env.outputs.version }}-test
          display_name: ${{ github.event.inputs.display_name }}
          archive_existing_version: true
